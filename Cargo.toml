[workspace]
members = ["crates/logging","src-tauri"]  # 空项目仅需 Tauri 核心目录
resolver = "2"           # 保留 Rust 新依赖解析器

# ===== 最小化构建配置 =====
[profile.release]
panic = "unwind"
codegen-units = 1
lto = "thin"
opt-level = 3
debug = 1
strip = "none"
overflow-checks = true

[profile.dev]
incremental = true
codegen-units = 64
opt-level = 0
debug = true
strip = "none"
overflow-checks = true
lto = false

# ===== 仅保留核心依赖 =====
[workspace.dependencies]
draft = { path = "crates/draft" }
logging = { path = "crates/logging" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
anyhow = "1.0.102"
parking_lot = "0.12.5"
flexi_logger = "0.31.9"
log = "0.4.32"
chrono = "0.4"
tar = "0.4"
flate2 = "1"
tempfile = "3"
# ===== Lint 规则 =====
[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
