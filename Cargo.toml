[workspace]
members = [
    "crates/logging",
    "src-tauri",
    "crates/draft",
    "crates/mcp",
    "crates/nimg",
]
resolver = "2" # 保留 Rust 新依赖解析器

# ===== 最小化构建配置 =====
[profile.release]
panic = "unwind"
codegen-units = 1
lto = "thin"
opt-level = 3
debug = 1
strip = "none"
overflow-checks = true

[profile.dev]
incremental = true
codegen-units = 64
opt-level = 0
debug = true
strip = "none"
overflow-checks = true
lto = false

[profile.fast-release]
inherits = "release"
codegen-units = 64
incremental = true
lto = false
opt-level = 0
debug = true
strip = false

# ===== 仅保留核心依赖 =====
[workspace.dependencies]
draft = { path = "crates/draft" }
logging = { path = "crates/logging" }
mcp = { path = "crates/mcp" }
nimg = { path = "crates/nimg" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
anyhow = "1.0.102"
parking_lot = "0.12.5"
flexi_logger = "0.31.9"
log = "0.4.32"
chrono = "0.4"
tar = "0.4"
flate2 = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
image = "0.25.10"
imageproc = "0.27.0"
ndarray = "0.17.2"
bytes = "1"
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
parquet = "54"
arrow = "54"
# ===== Lint 规则 =====
[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
