[package]
name = "run-deck"
version = "0.1.0"
description = "A minimal Tauri App"
authors = ["you"]
edition = "2024"

[lib]
name = "run_deck_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }  # 必须：Tauri 构建工具

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }  # 核心 Tauri 运行时
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.6.0"
logging = { workspace = true }
flexi_logger = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
draft = { workspace = true }
mcp = { workspace = true }
nimg = { workspace = true }
image = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
moka = { version = "0.12", features = ["sync"] }
http = "1"
mime_guess = "2"
tauri-plugin-pinia = "5.0.0"
[features]
prod = ["logging/prod"]



[lints]
workspace = true
